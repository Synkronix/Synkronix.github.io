<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOBOSUBA - Agar.io Ultra-Jelly Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; background: #0c0c0e; overflow: hidden; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Chakra Petch', sans-serif; }

        .game-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 94vh;
            aspect-ratio: 16 / 9;
            max-width: 96vw;
            background: #111113;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .left-panel {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .menu-btn {
            position: absolute;
            left: 28px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            opacity: 0.35;
            transition: opacity 0.2s;
        }
        .menu-btn:hover { opacity: 0.8; }
        .menu-bar { width: 18px; height: 3px; background: #666; border-radius: 2px; }

        .sobosuba-title {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: 'Orbitron', sans-serif;
            font-size: 5.5vh;
            font-weight: 900;
            letter-spacing: 2px;
            color: #2b2b2e;
            text-transform: lowercase;
            text-align: center;
        }

        .tank-wrapper {
            position: relative;
            height: 90%;
            aspect-ratio: 0.82;
            background: #232326;
            border-radius: 14px 14px 28px 28px;
            padding: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }

        .screw {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #444;
            border-radius: 50%;
            box-shadow: inset 1px 1px 1px #222;
        }
        .screw.tl { top: 10px; left: 10px; }
        .screw.tr { top: 10px; right: 10px; }
        .screw.bl { bottom: 12px; left: 12px; }
        .screw.br { bottom: 12px; right: 12px; }

        .grip-left, .grip-right {
            position: absolute;
            width: 14px;
            height: 100px;
            background: #323236;
            border-radius: 10px;
            top: 40%;
            transform: translateY(-50%);
        }
        .grip-left { left: -7px; }
        .grip-right { right: -7px; }

        .canvas-container {
            flex: 1;
            width: 100%;
            background: #050505;
            border-radius: 8px 8px 22px 22px;
            position: relative;
            overflow: hidden;
            clip-path: polygon(
                0% 0%, 
                100% 0%, 
                100% calc(100% - 32px), 
                calc(100% - 32px) 100%, 
                32px 100%, 
                0% calc(100% - 32px)
            );
        }

        canvas { display: block; width: 100%; height: 100%; }

        .right-panel {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .score-display {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: 'Orbitron', sans-serif;
            font-size: 8.5vh;
            font-weight: 900;
            color: #242427;
            letter-spacing: 4px;
        }

        .game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,5,5,0.88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            gap: 15px;
        }
        .game-over.show { display: flex; }
        .go-title { font-size: 24px; font-weight: 900; color: #ff3b3b; font-family: 'Orbitron'; }
        .go-score { font-size: 16px; color: #aaa; }
        .btn-restart {
            padding: 10px 24px;
            background: #333;
            border: none;
            color: #fff;
            font-family: 'Orbitron';
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-restart:hover { background: #555; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="left-panel">
            <div class="menu-btn">
                <div class="menu-bar"></div>
                <div class="menu-bar"></div>
                <div class="menu-bar"></div>
            </div>
            <div class="sobosuba-title">sobosuba</div>
        </div>

        <div class="tank-wrapper">
            <div class="screw tl"></div>
            <div class="screw tr"></div>
            <div class="screw bl"></div>
            <div class="screw br"></div>
            <div class="grip-left"></div>
            <div class="grip-right"></div>

            <div class="canvas-container" id="canvasContainer">
                <canvas id="gameCanvas"></canvas>
                <div class="game-over" id="gameOverModal">
                    <div class="go-title">GAME OVER</div>
                    <div class="go-score">FINAL SCORE: <span id="finalScore">0</span></div>
                    <button class="btn-restart" onclick="restartGame()">PLAY AGAIN</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="score-display" id="scoreDisplay">0</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        let width, height;
        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        resize();
        window.addEventListener('resize', resize);

        const { Engine, World, Bodies, Body, Events } = Matter;
        const engine = Engine.create({ enableSleeping: false });
        engine.world.gravity.y = 1.35;

        let score = 0;
        let gameOver = false;
        let blobs = [];
        let floatTexts = [];
        let particles = [];

        const COLORS = {
            1: '#eb2d30', 2: '#f6d928', 4: '#7af230', 8: '#3bf1d2',
            16: '#3c3bf8', 32: '#973af3', 64: '#f33d9c', 128: '#ff6923',
            256: '#d8fc30', 512: '#f3d12a', 1024: '#30e5f2', 2048: '#e62ff1'
        };

        function getRadius(val) {
            const base = width * 0.085;
            const mult = Math.log2(val);
            return base + mult * (width * 0.018);
        }

        const wallOpts = { isStatic: true, friction: 0.3, restitution: 0.2 };
        const wallThick = 60;

        const leftWall = Bodies.rectangle(-wallThick/2, height/2, wallThick, height * 2, wallOpts);
        const rightWall = Bodies.rectangle(width + wallThick/2, height/2, wallThick, height * 2, wallOpts);
        const bottomWall = Bodies.rectangle(width/2, height + wallThick/2, width * 2, wallThick, wallOpts);

        const cornerSize = 38;
        const leftCorner = Bodies.fromVertices(cornerSize/2, height - cornerSize/2, [
            { x: 0, y: height },
            { x: cornerSize * 1.2, y: height },
            { x: 0, y: height - cornerSize * 1.2 }
        ], wallOpts);

        const rightCorner = Bodies.fromVertices(width - cornerSize/2, height - cornerSize/2, [
            { x: width, y: height },
            { x: width, y: height - cornerSize * 1.2 },
            { x: width - cornerSize * 1.2, y: height }
        ], wallOpts);

        World.add(engine.world, [leftWall, rightWall, bottomWall, leftCorner, rightCorner]);

        let queue = [1, 2, 4, 8, 16];
        function generateNextTile() {
            const rand = Math.random();
            if (rand < 0.45) return 1;
            if (rand < 0.70) return 2;
            if (rand < 0.88) return 4;
            if (rand < 0.96) return 8;
            return 16;
        }

        // --- AGAR.IO STYLE HARMONIC WAVE VERTEX SYSTEM ---
        function createDeformableBlob(x, y, value) {
            const radius = getRadius(value);
            const body = Bodies.circle(x, y, radius, {
                restitution: 0.6,
                friction: 0.2,
                frictionAir: 0.002,
                density: 0.0012
            });

            body.value = value;
            body.radius = radius;
            body.mergeCooldown = 0;

            // 32 High-density perimeter points for ultra-liquid fidelity
            const pointCount = 32;
            body.nodes = [];
            for (let i = 0; i < pointCount; i++) {
                body.nodes.push({
                    angle: (i / pointCount) * Math.PI * 2,
                    offset: 0,
                    velocity: 0
                });
            }

            // Per-blob unique random wave phase offset for distinct idle wobble
            body.phase = Math.random() * Math.PI * 2;
            body.stretchX = 1;
            body.stretchY = 1;

            blobs.push(body);
            World.add(engine.world, body);
            return body;
        }

        function spawnSplatter(x, y, color, count = 16) {
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = Math.random() * 9 + 2;
                particles.push({
                    x, y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd - 2,
                    r: Math.random() * 5 + 2,
                    color,
                    life: 1.0
                });
            }
        }

        // Direct collision deformation physics
        Events.on(engine, 'collisionStart', (evt) => {
            evt.pairs.forEach(({ bodyA, bodyB, collision }) => {
                const bA = bodyA.value ? bodyA : null;
                const bB = bodyB.value ? bodyB : null;

                const normal = collision.normal;
                const impactVel = Math.hypot(
                    (bodyA.velocity?.x || 0) - (bodyB.velocity?.x || 0),
                    (bodyA.velocity?.y || 0) - (bodyB.velocity?.y || 0)
                );

                if (impactVel > 1.2) {
                    [bA, bB].forEach(b => {
                        if (!b || !b.nodes) return;
                        
                        const hitAngle = Math.atan2(normal.y, normal.x) - b.angle;
                        const impactForce = Math.min(impactVel * 4.5, 30);

                        // Deform vertices using proximity falloff
                        b.nodes.forEach(node => {
                            let diff = node.angle - hitAngle;
                            while (diff < -Math.PI) diff += Math.PI * 2;
                            while (diff > Math.PI) diff -= Math.PI * 2;

                            const proximity = Math.cos(diff);
                            if (proximity > 0) {
                                node.velocity -= proximity * impactForce;
                            } else {
                                // Volume expansion on rear side
                                node.velocity += Math.abs(proximity) * impactForce * 0.5;
                            }
                        });

                        const angleNormal = Math.abs(Math.atan2(normal.y, normal.x));
                        if (angleNormal > Math.PI / 4 && angleNormal < (3 * Math.PI) / 4) {
                            b.stretchY = Math.max(0.4, 1 - impactVel * 0.06);
                            b.stretchX = Math.min(1.6, 1 + impactVel * 0.06);
                        } else {
                            b.stretchX = Math.max(0.4, 1 - impactVel * 0.06);
                            b.stretchY = Math.min(1.6, 1 + impactVel * 0.06);
                        }
                    });
                }

                // Merge Handling
                if (bA && bB && bA.value === bB.value && bA.mergeCooldown === 0 && bB.mergeCooldown === 0) {
                    const nextVal = bA.value * 2;
                    const midX = (bA.position.x + bB.position.x) / 2;
                    const midY = (bA.position.y + bB.position.y) / 2;

                    World.remove(engine.world, bB);
                    blobs = blobs.filter(b => b !== bB);

                    bA.value = nextVal;
                    bA.radius = getRadius(nextVal);
                    bA.mergeCooldown = 12;
                    Body.setPosition(bA, { x: midX, y: midY });

                    // Violent radial wave explosion across all 32 perimeter nodes
                    bA.nodes.forEach((node, i) => {
                        node.velocity = Math.sin(i * 0.5) * 35;
                    });

                    spawnSplatter(midX, midY, COLORS[nextVal] || '#fff', 20);

                    score += nextVal;
                    document.getElementById('scoreDisplay').textContent = score;

                    floatTexts.push({
                        x: midX, y: midY,
                        text: `+${nextVal}`,
                        color: COLORS[nextVal] || '#fff',
                        alpha: 1.0
                    });
                }
            });
        });

        // Touch & Drag Controls
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };

        const getTouchPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const onPointerDown = (e) => {
            if (gameOver) return;
            isDragging = true;
            dragStart = getTouchPos(e);
            dragCurrent = { ...dragStart };
        };

        const onPointerMove = (e) => {
            if (!isDragging) return;
            dragCurrent = getTouchPos(e);
        };

        const onPointerUp = () => {
            if (!isDragging || gameOver) return;
            isDragging = false;

            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            const dist = Math.hypot(dx, dy);

            const activeVal = queue.shift();
            queue.push(generateNextTile());

            const spawnX = width / 2;
            const spawnY = height * 0.12;
            const blob = createDeformableBlob(spawnX, spawnY, activeVal);

            if (dist > 15) {
                const angle = Math.atan2(dy, dx);
                const power = Math.min(dist * 0.14, 22);
                Body.setVelocity(blob, {
                    x: Math.cos(angle) * power,
                    y: Math.sin(angle) * power
                });
            } else {
                Body.setVelocity(blob, { x: 0, y: 2.5 });
            }
        };

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        canvas.addEventListener('touchstart', onPointerDown, { passive: true });
        canvas.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        let overflowTime = 0;
        function checkOverflow() {
            const dangerY = height * 0.18;
            const overflowing = blobs.some(b => b.position.y < dangerY && Math.abs(b.velocity.y) < 0.2);

            if (overflowing) {
                overflowTime += 1/60;
                if (overflowTime > 2.0 && !gameOver) {
                    gameOver = true;
                    document.getElementById('finalScore').textContent = score;
                    document.getElementById('gameOverModal').classList.add('show');
                }
            } else {
                overflowTime = Math.max(0, overflowTime - 1/60);
            }
        }

        function restartGame() {
            blobs.forEach(b => World.remove(engine.world, b));
            blobs = [];
            particles = [];
            score = 0;
            gameOver = false;
            overflowTime = 0;
            document.getElementById('scoreDisplay').textContent = 0;
            document.getElementById('gameOverModal').classList.remove('show');
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // 1. Top Dispenser Queue
            const queueY = height * 0.08;
            const activeX = width * 0.42;
            const spacing = width * 0.12;

            const activeVal = queue[0];
            const activeRad = getRadius(activeVal);
            
            ctx.fillStyle = COLORS[activeVal] || '#fff';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;

            ctx.beginPath();
            ctx.roundRect(activeX - activeRad - 10, queueY - activeRad - 6, activeRad * 2 + 20, activeRad * 2 + 12, 30);
            ctx.stroke();
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.font = `900 ${activeRad * 0.9}px 'Chakra Petch', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(activeVal, activeX, queueY);

            for (let i = 1; i <= 3; i++) {
                const val = queue[i];
                const qRad = getRadius(val) * 0.7;
                const qX = activeX + activeRad + 20 + (i - 1) * (spacing);
                
                ctx.fillStyle = COLORS[val] || '#fff';
                ctx.beginPath();
                ctx.roundRect(qX - qRad, queueY - qRad, qRad * 2, qRad * 2, 10);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.font = `900 ${qRad * 0.9}px 'Chakra Petch', sans-serif`;
                ctx.fillText(val, qX, queueY);
            }

            // 2. Trajectory Aim Arrow
            if (isDragging) {
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 10) {
                    const angle = Math.atan2(dy, dx);
                    const arrowLen = Math.min(dist * 0.8, 90);
                    const startX = width / 2;
                    const startY = height * 0.15;
                    const endX = startX + Math.cos(angle) * arrowLen;
                    const endY = startY + Math.sin(angle) * arrowLen;

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();

                    const headLen = 12;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(endX, endY);
                    ctx.lineTo(endX - headLen * Math.cos(angle - Math.PI / 6), endY - headLen * Math.sin(angle - Math.PI / 6));
                    ctx.lineTo(endX - headLen * Math.cos(angle + Math.PI / 6), endY - headLen * Math.sin(angle + Math.PI / 6));
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // 3. Splatter Particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.22;
                p.life -= 0.03;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            // 4. AGAR.IO ULTRA-JELLY RENDERING PIPELINE
            const now = Date.now() * 0.003;

            blobs.forEach(b => {
                if (b.mergeCooldown > 0) b.mergeCooldown--;

                const r = b.radius;
                const speed = Math.hypot(b.velocity.x, b.velocity.y);

                // Smoothly restore global transform squashing
                b.stretchX += (1 - b.stretchX) * 0.08;
                b.stretchY += (1 - b.stretchY) * 0.08;

                ctx.save();
                ctx.translate(b.position.x, b.position.y);
                ctx.rotate(b.angle);
                ctx.scale(b.stretchX, b.stretchY);

                const nodeCount = b.nodes.length;
                const points = [];

                // Calculate multi-frequency sine wave overlay (Agar.io signature liquid wobble)
                for (let i = 0; i < nodeCount; i++) {
                    const node = b.nodes[i];
                    
                    // Spring physics for collision responses
                    const spring = -node.offset * 0.08;
                    const damping = -node.velocity * 0.09;
                    node.velocity += spring + damping;
                    node.offset += node.velocity;

                    // Superimposed sinusoidal waves for fluid perimeter motion
                    const wave1 = Math.sin(now * 2 + node.angle * 3 + b.phase) * (r * 0.045);
                    const wave2 = Math.cos(now * 3.5 - node.angle * 2) * (r * 0.025);
                    const motionWobble = Math.sin(now * 5 + node.angle * 4) * Math.min(speed * 0.6, r * 0.12);

                    const totalOffset = node.offset + wave1 + wave2 + motionWobble;
                    const curR = Math.max(r * 0.5, r + totalOffset);

                    points.push({
                        x: Math.cos(node.angle) * curR,
                        y: Math.sin(node.angle) * curR
                    });
                }

                // Smooth Catmull-Rom style Spline curve for liquid-smooth cell contours
                ctx.beginPath();
                const lastPt = points[nodeCount - 1];
                const firstPt = points[0];
                ctx.moveTo((lastPt.x + firstPt.x) / 2, (lastPt.y + firstPt.y) / 2);

                for (let i = 0; i < nodeCount; i++) {
                    const nextIdx = (i + 1) % nodeCount;
                    const midX = (points[i].x + points[nextIdx].x) / 2;
                    const midY = (points[i].y + points[nextIdx].y) / 2;
                    ctx.quadraticCurveTo(points[i].x, points[i].y, midX, midY);
                }
                ctx.closePath();

                // Base Fill Color
                ctx.fillStyle = COLORS[b.value] || '#ffffff';
                ctx.fill();

                // Distinct Agar.io dark outer membrane contour
                ctx.strokeStyle = 'rgba(10, 10, 10, 0.85)';
                ctx.lineWidth = Math.max(3, r * 0.07);
                ctx.stroke();

                // Soft inner cell shine depth gradient
                const grad = ctx.createRadialGradient(0, -r * 0.2, r * 0.1, 0, 0, r);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
                grad.addColorStop(0.6, 'rgba(255, 255, 255, 0.05)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0.15)');
                ctx.fillStyle = grad;
                ctx.fill();

                // Number Label
                ctx.fillStyle = '#000000';
                ctx.font = `900 ${r * 0.75}px 'Chakra Petch', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.value, 0, 0);

                ctx.restore();
            });

            // 5. Score Float Text
            floatTexts = floatTexts.filter(ft => ft.alpha > 0);
            floatTexts.forEach(ft => {
                ft.y -= 1.2;
                ft.alpha -= 0.02;
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.font = `900 18px 'Orbitron', sans-serif`;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1.0;
            });

            Engine.update(engine, 1000 / 60);
            checkOverflow();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
